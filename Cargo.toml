[package]
name = "nmeagc"
version = "0.1.0"
description = "NMEA GNSS data client and visualizer implemented in Rust"
authors = ["ErnestoMLopez <ernesto.lopez@ing.unlp.edu.ar>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
strum = "0.28.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
